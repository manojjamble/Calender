<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
FLUTTER NOTES
 #app column ........ Scaffold(appBar, body, bottomNavigationBar, floatingActionButton)
 .ab ................ AppBar (title, IconButton x3, TextButton "Today")
 #view .............. body; PageView-like swipe -> GestureDetector(onHorizontalDragEnd)
 Month grid ......... Column(weekday Row + 6 Expanded Rows of InkWell cells); long-press -> onLongPress
 .ml / .row ......... ListView + ListTile-like rows; Agenda = CustomScrollView + SliverPersistentHeader (sticky)
 Week/Day grid ...... SingleChildScrollView > Stack with Positioned event blocks (overlap layout in lay())
 .nv ................ NavigationBar (4 NavigationDestination, pill indicator)
 .fab ............... FloatingActionButton (52x52, radius 16)
 .shw/.sh ........... showModalBottomSheet(isScrollControlled, shape top radius 24, maxHeight 85%)
 .seg ............... SegmentedButton<Repeat>;  .tgl ... Switch;  .sws ... Wrap of color IconButtons
 .ev / .chip ........ Card/Container(border-left 3px) with color.withOpacity(.14)
 .ab brand/avatar ..... AppBar(leading: logo+title, actions: CircleAvatar in PopupMenuButton)
 Theme tokens ....... ThemeData + ColorScheme (light/dark), spacing/radius consts
-->
<style>
/* ===== tokens ===== */
:root{
 --bg:#FAF9F7;--surface:#FFFFFF;--surface-2:#F3F1EE;--border:#E7E4DF;--text:#1C1B1A;--text-2:#5E5A55;--text-3:#8F8A83;
 --primary:#0F766E;--on-primary:#FFFFFF;--primary-tint:#D5EEEA;--danger:#B42318;
 --ev-teal:#0F766E;--ev-indigo:#4F5BD5;--ev-plum:#8E4585;--ev-rose:#C2455B;--ev-amber:#B7791F;--ev-olive:#5F7A3A;--ev-slate:#4B6584;--ev-terracotta:#C05A3A;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
 --r1:8px;--r2:12px;--r3:16px;--r4:24px;--rf:999px;
 --e1:0 1px 2px rgba(28,27,26,.06);--e2:0 2px 8px rgba(28,27,26,.08);--e3:0 6px 20px rgba(28,27,26,.12);
 --scrim:rgba(28,27,26,.4);--canvas:var(--surface-2);--on-color:#FFFFFF;--f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121413;--surface:#1B1D1C;--surface-2:#242726;--border:#2E3231;--text:#ECEBE9;--text-2:#A9A6A1;--text-3:#75716C;
 --primary:#4FB8AC;--on-primary:#06201D;--primary-tint:#17413D;--danger:#F97066;--canvas:var(--bg);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#121413;--surface:#1B1D1C;--surface-2:#242726;--border:#2E3231;--text:#ECEBE9;--text-2:#A9A6A1;--text-3:#75716C;
 --primary:#4FB8AC;--on-primary:#06201D;--primary-tint:#17413D;--danger:#F97066;--canvas:var(--bg);color-scheme:dark}
/* ===== reset ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;text-align:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
ul{list-style:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 14px/20px var(--f);overflow:hidden;-webkit-user-select:none;user-select:none}
/* ===== layout ===== */
#app{position:relative;display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--bg)}
.ab{flex:none;height:48px;display:flex;align-items:center;padding:0 var(--s4);background:var(--surface);border-bottom:1px solid var(--border)}
.ab h1{flex:1;min-width:0;font:600 16px/24px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--rf);color:var(--text-2)}
.ib:active,.txt:active{background:var(--surface-2)}
.txt{height:40px;padding:0 var(--s2);border-radius:var(--r1);color:var(--primary);font-weight:600}
#view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.vw{flex:1;min-height:0;display:flex;flex-direction:column;animation:in 200ms ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.nv{flex:none;height:56px;display:flex;background:var(--surface);border-top:1px solid var(--border)}
.nv button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);font:500 11px/16px var(--f)}
.nv span{width:48px;height:24px;border-radius:var(--rf);display:grid;place-items:center;transition:background 200ms ease-out}
.nv .on{color:var(--primary)}.nv .on span{background:var(--primary-tint)}
.nv svg{width:20px;height:20px}
.fab{position:absolute;right:var(--s4);bottom:calc(56px + var(--s4));width:52px;height:52px;border-radius:var(--r3);background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:var(--e3);z-index:5}
/* ===== views: month ===== */
.mw{flex:0 0 50%;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--border)}
.mh,.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.mh{height:28px;align-items:center;text-align:center;font:500 11px/16px var(--f);color:var(--text-3);border-bottom:1px solid var(--border)}
.mg{flex:1;min-height:0;grid-template-rows:repeat(6,1fr)}
.cl{display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:var(--s1);min-height:0;overflow:hidden;border-right:1px solid var(--border);border-bottom:1px solid var(--border);-webkit-touch-callout:none}
.cl:nth-child(7n){border-right:0}.cl:nth-last-child(-n+7){border-bottom:0}
.dn{width:24px;height:24px;flex:none;border-radius:var(--rf);display:grid;place-items:center;font:500 12px/16px var(--f)}
.out .dn{color:var(--text-3)}.sel .dn{background:var(--primary-tint);color:var(--primary)}.tdy .dn{background:var(--primary);color:var(--on-primary)}
.dots{display:flex;gap:var(--s1);height:6px}.dots i{width:6px;height:6px;border-radius:var(--rf)}
.ml{flex:1;min-height:0;overflow-y:auto}
.lh{padding:var(--s2) var(--s4);font:600 16px/24px var(--f)}
/* ===== views: rows / agenda ===== */
.row{display:flex;align-items:stretch;gap:var(--s3);width:100%;min-height:48px;padding:var(--s2) var(--s4);border-bottom:1px solid var(--border)}
.row:active{background:var(--surface-2)}
.eb{width:3px;flex:none;border-radius:2px}
.rt{display:flex;flex-direction:column;min-width:0}
.rt b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{font:400 12px/16px var(--f);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag{overflow-y:auto;display:block}
.ah{position:sticky;top:0;z-index:1;padding:var(--s1) var(--s4);background:var(--surface-2);border-bottom:1px solid var(--border);font:500 11px/16px var(--f);color:var(--text-2)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s2);padding:var(--s4);color:var(--text-3)}
.empty svg{width:48px;height:48px}
/* ===== views: week/day time grid ===== */
.tgh,.ads{flex:none;display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.ads{max-height:64px;overflow-y:auto}
.gut{width:40px;flex:none}
.dh{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:var(--s1);border-left:1px solid var(--border)}
.dh .lb{font:500 11px/16px var(--f);color:var(--text-3)}
.dh.tdy .dn{background:var(--primary);color:var(--on-primary)}
.adc{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s1);padding:var(--s1);border-left:1px solid var(--border)}
#tgs{flex:1;min-height:0;overflow-y:auto}
.tgi{display:flex;height:1152px}
.hl{height:48px;position:relative}
.hl span{position:absolute;top:0;right:var(--s1);transform:translateY(-8px);font:500 11px/16px var(--f);color:var(--text-3)}
.col{flex:1;min-width:0;position:relative;border-left:1px solid var(--border);background-image:repeating-linear-gradient(to bottom,var(--border) 0,var(--border) 1px,transparent 1px,transparent 48px)}
.ev{display:block;width:100%;min-height:20px;overflow:hidden;padding:2px 4px;border-radius:6px;border-left:3px solid var(--c);background:var(--cb);color:var(--c);font:400 12px/16px var(--f)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col .ev{position:absolute;width:auto}
.now{position:absolute;left:0;right:0;height:2px;background:var(--primary);z-index:2;pointer-events:none}
.now::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:var(--rf);background:var(--primary)}
/* ===== sheet ===== */
.shw{position:absolute;inset:0;z-index:10;visibility:hidden;transition:visibility 0s 200ms}
.shw.open{visibility:visible;transition-delay:0s}
.scr{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 200ms ease-out}
.open .scr{opacity:1}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:85%;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);background:var(--surface);border-radius:var(--r4) var(--r4) 0 0;box-shadow:var(--e3);transform:translateY(100%);transition:transform 200ms ease-out;-webkit-user-select:text;user-select:text}
.open .sh{transform:none}
.sh>*{flex:none}
.handle{width:32px;height:4px;border-radius:var(--rf);background:var(--border);align-self:center}
.sh h2{font:600 16px/24px var(--f)}
.fld{display:flex;flex-direction:column;gap:var(--s1)}
.fld>span{font:500 11px/16px var(--f);color:var(--text-3)}
input,select,textarea{width:100%;height:44px;padding:0 var(--s3);border:1px solid var(--border);border-radius:var(--r1);background:var(--bg);color:var(--text)}
textarea{height:72px;padding:var(--s3);resize:none}
input:focus,textarea:focus{border-color:var(--primary)}
.sw{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px}
.tgl{width:44px;height:24px;position:relative;border-radius:var(--rf);background:var(--border);transition:background 200ms ease-out}
.tgl i{position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform 200ms ease-out}
.tgl.on{background:var(--primary)}.tgl.on i{transform:translateX(20px)}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--rf);overflow:hidden}
.seg button{flex:1;height:40px;text-align:center;color:var(--text-2)}
.seg button+button{border-left:1px solid var(--border)}
.seg .on{background:var(--primary-tint);color:var(--primary);font-weight:600}
.sws{display:flex;justify-content:space-between}
.sws button{width:40px;height:40px;display:grid;place-items:center}
.sws i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--on-color);font:600 12px/16px var(--f)}
.err{font:400 12px/16px var(--f);color:var(--danger)}
.save{width:100%;height:44px;border-radius:var(--r2);background:var(--primary);color:var(--on-primary);font-weight:600;text-align:center}
.del{height:40px;color:var(--danger);font-weight:600;text-align:center}
/* ===== custom repeat ===== */
.every{display:flex;align-items:center;gap:var(--s2);color:var(--text-2)}
.every input{width:72px;text-align:center}
.dow{display:flex;justify-content:space-between}
.dow button{width:40px;height:40px;border-radius:var(--rf);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2);font-weight:500}
.dow .on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.cps{display:none;flex-direction:column;gap:var(--s1);width:100%;min-width:0}
.cps .ev{text-align:left;white-space:nowrap;text-overflow:ellipsis}
/* ===== brand / account menu / end rules ===== */
.brand{display:flex;align-items:center;gap:var(--s2);height:40px;padding-right:var(--s2);flex:none}
.brand b{display:none;font:600 16px/24px var(--f)}
.logo{width:28px;height:28px;border-radius:var(--r1);background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.av{width:32px;height:32px;border-radius:50%;background:var(--primary-tint);color:var(--primary);display:grid;place-items:center;flex:none}
.av svg{width:20px;height:20px}.av.lg{width:40px;height:40px}
.mn{position:absolute;inset:0;z-index:20;visibility:hidden;transition:visibility 0s 200ms}.mn.open{visibility:visible;transition-delay:0s}
.mscr{position:absolute;inset:0}
.mp{position:absolute;top:48px;right:var(--s4);width:240px;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--e2);opacity:0;transform:translateY(-4px);transition:opacity 200ms ease-out,transform 200ms ease-out}
.mn.open .mp{opacity:1;transform:none}
.mu{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-bottom:1px solid var(--border)}
.mi{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 var(--s3)}
.mi:active{background:var(--surface-2)}
select{font:inherit}.every select{flex:1}
/* ===== floating cards ===== */
#app{background:var(--canvas)}
.ab{background:none;border-bottom:0}
#view{margin:0 var(--s2) var(--s2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r3)}
#view.free{background:none;border:0}
.lh{padding:var(--s3) var(--s4)}
.vt{display:none;margin:0 var(--s2);border:1px solid var(--border);border-radius:var(--rf);overflow:hidden}
.vt button{width:56px;height:36px;display:grid;place-items:center;color:var(--text-2)}.vt .on{background:var(--primary-tint);color:var(--primary)}
/* ===== tasks ===== */
.tk{flex-direction:row;gap:var(--s4)}
.tks{display:none;width:232px;flex:none;flex-direction:column;gap:var(--s1)}
.crt{display:flex;align-items:center;gap:var(--s3);height:56px;padding:0 var(--s5);margin-bottom:var(--s3);align-self:flex-start;border-radius:var(--r3);background:var(--surface);box-shadow:var(--e2);font-weight:500}
.si{display:flex;align-items:center;gap:var(--s3);height:40px;padding:0 var(--s4);border-radius:var(--rf)}
.si.on{background:var(--primary-tint);color:var(--primary);font-weight:600}
.si svg{width:20px;height:20px}.si em{margin-left:auto;font:400 12px/16px var(--f);font-style:normal;color:var(--text-3)}
.sq{width:16px;height:16px;border-radius:4px;background:var(--primary)}
.sl{padding:var(--s4) var(--s4) var(--s1);font:500 11px/16px var(--f);color:var(--text-3)}
.tkc{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s1);padding:var(--s4) var(--s4) var(--s5);background:var(--surface);border:1px solid var(--border);border-radius:var(--r3)}
.tkc>*{flex:none}
.tkc h2{font:600 22px/28px var(--f);padding-bottom:var(--s2)}
.chs{display:flex;flex-wrap:wrap;gap:var(--s2)}
.ch{display:inline-flex;align-items:center;gap:var(--s1);height:32px;padding:0 var(--s3);border:1px solid var(--border);border-radius:var(--rf);font:400 12px/16px var(--f);color:var(--text-2)}
.ch.on{background:var(--primary-tint);color:var(--primary);border-color:transparent}.ch svg{width:16px;height:16px}
.add{display:flex;align-items:center;gap:var(--s3);height:48px;color:var(--primary);font-weight:600}
.gl{padding:var(--s4) 0 var(--s1);font:500 12px/16px var(--f);color:var(--text-2)}.gl.late{color:var(--danger)}
.tg2{display:flex;align-items:center;gap:var(--s2);text-align:left}
.tr{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s2);border-radius:var(--r2);cursor:pointer}.tr:active{background:var(--surface-2)}
.ck{width:24px;height:24px;flex:none;border:2px solid var(--text-3);border-radius:50%;display:grid;place-items:center;color:var(--on-primary)}
.ck.on{background:var(--primary);border-color:var(--primary)}.ck svg{width:14px;height:14px}
.rt small.late{color:var(--danger)}.sk{text-decoration:line-through;color:var(--text-3)}
.ai,.st{display:flex;align-items:center;gap:var(--s1);color:var(--text-3);font:400 12px/16px var(--f)}.ai svg,.st svg{width:16px;height:16px}.st{color:var(--ev-amber)}
.th,.tbar{display:flex;align-items:center;justify-content:space-between}.tbar{justify-content:flex-end;gap:var(--s1)}
.big{height:48px;padding:0;border:0;border-bottom:1px solid var(--border);border-radius:0;background:none;font:600 22px/28px var(--f)}
.qk{display:flex;flex-wrap:wrap;gap:var(--s2)}
.ed{border:1px solid var(--border);border-radius:var(--r1);overflow:hidden}
.tb{display:flex;gap:var(--s1);padding:var(--s1);background:var(--surface-2);border-bottom:1px solid var(--border)}
.tb button{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--text-2);font-weight:600}.tb button:active{background:var(--border)}
.rte{min-height:96px;max-height:200px;overflow-y:auto;padding:var(--s3);outline:0;-webkit-user-select:text;user-select:text}
.rte:empty::before{content:attr(data-ph);color:var(--text-3)}
.rte ul,.dsc ul{padding-left:var(--s5);list-style:disc}.rte ol,.dsc ol{padding-left:var(--s5);list-style:decimal}.rte h3,.dsc h3{font:600 16px/24px var(--f)}
.at{display:inline-flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s2) 0 var(--s3);border:1px solid var(--border);border-radius:var(--r1);font:400 12px/16px var(--f)}
.at svg{width:16px;height:16px;color:var(--primary)}.at small{color:var(--text-3)}.at button{width:24px;height:24px;display:grid;place-items:center}
.pk{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.pi{display:flex;align-items:center;gap:var(--s3);min-height:48px;padding:var(--s2) var(--s3);border-bottom:1px solid var(--border)}
.pi.on{background:var(--primary-tint)}.pi svg{width:20px;height:20px;flex:none;color:var(--primary)}.pi .rt{flex:1}
.ft{display:flex;justify-content:flex-end;gap:var(--s2)}
.save2{height:44px;padding:0 var(--s5);border-radius:var(--r2);background:var(--primary);color:var(--on-primary);font-weight:600}
.mw2{position:relative}
.dm{position:absolute;right:0;top:44px;width:176px;z-index:3;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--e2);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity 200ms ease-out,transform 200ms ease-out,visibility 0s 200ms}
.dm.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.dm button{display:flex;align-items:center;gap:var(--s3);width:100%;height:44px;padding:0 var(--s3)}.dm svg{width:18px;height:18px}
.tv{display:flex;flex-direction:column;gap:var(--s3)}.tv .hd{display:flex;align-items:flex-start;gap:var(--s3)}.tv h2{font:600 22px/28px var(--f)}
.pl{display:inline-flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s3);border:1px solid var(--border);border-radius:var(--rf);font:400 12px/16px var(--f)}.pl svg{width:16px;height:16px}.pl.late{color:var(--danger);border-color:var(--danger)}
/* ===== google-style task form + recurrence dialog ===== */
#tsh input,#tsh select{background:var(--surface-2);border-color:transparent}
#tsh .big{background:none;border-radius:0;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:var(--s2)}
.tab{height:40px;padding:0 var(--s4);border-radius:var(--r1);color:var(--text-2);font-weight:500}.tab.on{background:var(--primary-tint);color:var(--primary)}
.rw{display:flex;gap:var(--s3);align-items:flex-start}
.ri{width:24px;height:44px;flex:none;display:grid;place-items:center;color:var(--text-2)}.ri svg{width:20px;height:20px}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s2)}
.rb .sm{width:auto;align-self:flex-start;min-width:136px}
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}.tm input[type=date]{flex:0 0 140px;width:140px;text-align:left}.tt{display:flex;align-items:center;gap:var(--s2);flex:1 1 220px}.tt input{flex:1 1 0;min-width:96px;width:auto;text-align:center}.tm input,.dlr input{padding:0 var(--s2)}
.cbx{display:flex;align-items:center;gap:var(--s3);height:40px}
.cb{width:20px;height:20px;border:2px solid var(--text-2);border-radius:4px;display:grid;place-items:center;color:var(--on-primary)}.cb.on{background:var(--primary);border-color:var(--primary)}.cb svg{width:14px;height:14px}
.lnk{height:44px;text-align:left;color:var(--text-2)}

<div id="app">
 <header class="ab">

 </header>
 <main id="view"></main>

 <div class="shw"><div class="scr"></div><div class="sh" role="dialog" aria-modal="true"></div></div>

<script>
/* ===== data / logic ===== */
const R=document.documentElement,$=s=>document.querySelector(s);
const T=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()),nd=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const at=(o,h,m=0)=>+new Date(T.getFullYear(),T.getMonth(),T.getDate()+o,h,m);
const uid=()=>Math.random().toString(36).slice(2,9),cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL=['teal','indigo','plum','rose','amber','olive','slate','terracotta'].map(n=>getComputedStyle(R).getPropertyValue('--ev-'+n).trim());
const ic=p=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`;
const IC={l:'M15 6l-6 6 6 6',r:'M9 6l6 6-6 6',plus:'M12 5v14M5 12h14',moon:'M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z',
 tasks:'M12 21a9 9 0 100-18 9 9 0 000 18zM8.5 12l2.5 2.5 4.5-5',x:'M6 6l12 12M18 6L6 18',check:'M5 12l4 4 10-10',clip:'M21 12l-8.5 8.5a5 5 0 01-7-7L14 5a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 8',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',db:'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',edit:'M4 20h4L19 9l-4-4L4 16zM13 7l4 4',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',more:'M12 5h.01M12 12h.01M12 19h.01',copy:'M9 9h11v11H9zM5 15V4h11',dn:'M6 9l6 6 6-6',rt:'M9 6l6 6-6 6',clock:'M12 7v5l3 2M12 21a9 9 0 100-18 9 9 0 000 18z',target:'M12 21a9 9 0 100-18 9 9 0 000 18zM12 17a5 5 0 100-10 5 5 0 000 10zM12 13a1 1 0 100-2 1 1 0 000 2z',list:'M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01',brief:'M4 8h16v11H4zM9 8V5h6v3',lock:'M6 11h12v9H6zM8 11V8a4 4 0 118 0v3',rep:'M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-4 4-6 8-6s8 2 8 6',sun:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',
 month:'M4 5h16v15H4zM4 10h16M9 5v15M15 5v15',week:'M4 5h16v15H4zM4 10h16M10 10v10M16 10v10',day:'M4 5h16v15H4zM4 10h16',agenda:'M4 7h16M4 12h16M4 17h10',cal:'M4 5h16v15H4zM4 10h16M8 3v4M16 3v4'};
const NAV=[['month','Month'],['week','Week'],['day','Day'],['agenda','Agenda'],['tasks','Tasks']];

const cfg={ws:0,h24:false,dur:60,view:'month',list:'',sc:true,name:'Alex Kumar',email:'alex@example.com'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('cal-cfg')||'{}'))}catch(e){}
let prevV='month',thMode='system';
function cfgApply(){try{localStorage.setItem('cal-cfg',JSON.stringify(cfg))}catch(e){}$('#mnn').textContent=cfg.name;$('#mne').textContent=cfg.email}
let lastCal='month',V=cfg.view||'month',cur=new Date(T),sel=new Date(T),f=null,ev=[];
const mk=(t,o,a,b,ci,loc='',notes='',rep='none')=>({id:uid(),title:t,start:at(o,...a),end:at(o,...b),allDay:false,color:PAL[ci],loc,notes,repeat:rep});
const ad=(t,o,n,ci,rep='none')=>({id:uid(),title:t,start:at(o,0),end:at(o+n,0),allDay:true,color:PAL[ci],loc:'',notes:'',repeat:rep});
function seed(){return[
 mk('Weekly planning',-7,[9,0],[10,0],0,'Room 4','Priorities and blockers','weekly'),
 mk('Design review',0,[9,30],[11,0],1,'Zoom'),mk('Coffee with Priya',0,[9,45],[10,30],3,'Blue Tokri'),
 mk('Lunch',0,[12,30],[13,30],4),mk('Dentist',0,[17,0],[18,0],6,'Dr. Rao','Bring insurance card'),
 {...mk('Gym',-7,[7,0],[8,0],7),repeat:'custom',unit:'week',days:[1,3,5],every:1,endMode:'after',count:20},mk('Sprint demo',1,[14,0],[15,0],1,'Hall A'),mk('1:1 with Sam',1,[14,30],[15,15],0),
 mk('Client call',2,[11,0],[12,0],6),mk('Yoga',3,[18,30],[19,30],5),mk('Family dinner',3,[20,0],[21,30],3,'Home'),
 mk('Book club',-1,[19,0],[20,30],2),mk('Retro',-3,[15,0],[16,0],7),
 ad("Priya's birthday",2,1,2),ad('Team offsite',4,3,5,'none'),ad('Pay rent',8,1,4,'monthly')]}
const persist=()=>{try{localStorage.setItem('cal-ev',JSON.stringify(ev))}catch(e){}};
try{const j=localStorage.getItem('cal-ev');if(j)ev=JSON.parse(j)}catch(e){}
let mg=0;try{mg=localStorage.getItem('cal-mig')}catch(e){}
if(!ev.length&&!mg)ev=seed();

/* expand repeats for [rs,re) */
function occ(rs,re,L=ev){const o=[];L.forEach(e=>{const du=e.end-e.start;
 if(e.repeat==='none'){if(e.start<re&&e.end>rs)o.push({ev:e,s:e.start,e:e.end});return}
 const b=new Date(e.start),cu=e.repeat==='custom',u=cu?(e.unit||'week'):{daily:'day',weekly:'week',monthly:'month'}[e.repeat],n=cu?(e.every||1):1,
  dys=cu&&u==='week'&&(e.days||[]).length?e.days:[b.getDay()],sun=+nd(b,-b.getDay()),
  lim=e.endMode==='on'?+nd(new Date(e.endOn),1):Infinity,mx=e.endMode==='after'?e.count:Infinity;
 let c=0,i=mx===Infinity?Math.max(0,Math.floor((rs-du-e.start)/864e5)-1):0;
 for(;i<5000&&c<mx;i++){const d=nd(b,i),s=+new Date(d.getFullYear(),d.getMonth(),d.getDate(),b.getHours(),b.getMinutes());
  if(s>=re||s>=lim)break;let ok;
  if(u==='day')ok=i%n===0;
  else if(u==='week')ok=dys.includes(d.getDay())&&Math.floor(Math.round((+d-sun)/864e5)/7)%n===0;
  else if(u==='month')ok=d.getDate()===b.getDate()&&((d.getFullYear()-b.getFullYear())*12+d.getMonth()-b.getMonth())%n===0;
  else ok=d.getMonth()===b.getMonth()&&d.getDate()===b.getDate()&&(d.getFullYear()-b.getFullYear())%n===0;
  if(ok){c++;if(s+du>rs)o.push({ev:e,s,e:s+du})}}});return o}
const dueOcc=d=>tasks.filter(t=>t.due&&(cfg.sc||!t.done)&&+sod(new Date(t.due))===+d).map(t=>({ev:{id:t.id,task:true,dueItem:true,title:'Due: '+t.title,allDay:true,color:PAL[3],done:t.done},s:+d,e:+nd(d,1)}));
const dayOcc=d=>occ(+d,+nd(d,1)).concat(occ(+d,+nd(d,1),tasks.filter(t=>t.start&&(cfg.sc||!t.done))),dueOcc(d)).sort((a,b)=>b.ev.allDay-a.ev.allDay||a.s-b.s);
const tm=ms=>new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:!cfg.h24});
const cs=c=>`--c:${c};--cb:${c}24`;
/* overlap layout: cluster, lowest free column, k = columns in cluster */
function lay(l){l.sort((a,b)=>a.s-b.s||b.e-a.e);let cl=[],cc=[],ce=0;
 const fl=()=>{cl.forEach(x=>x.k=cc.length);cl=[];cc=[];ce=0};
 l.forEach(x=>{if(cl.length&&x.s>=ce)fl();let c=cc.findIndex(t=>t<=x.s);if(c<0)c=cc.length;cc[c]=x.e;x.c=c;cl.push(x);ce=Math.max(ce,x.e)});fl();return l}

/* ===== views ===== */
const empty=t=>`<div class="empty">${ic(IC.cal)}<p>${t}</p></div>`;
const ckb=e=>e.dueItem?`<span class="di">${ic(IC.target)}</span>`:e.task?`<span class="ck ${e.done?'on':''}" data-ck="${e.id}" role="checkbox" aria-checked="${!!e.done}">${e.done?ic(IC.check):''}</span>`:'';
const ida=o=>(o.ev.task?'data-t=':'data-id=')+'"'+o.ev.id+'"';
const row=o=>`<button class="row" ${ida(o)}><i class="eb" style="background:${o.ev.color}"></i>${ckb(o.ev)}<span class="rt"><b class="${o.ev.done?'sk':''}">${esc(o.ev.title)}</b><small>${o.ev.allDay?'All day':tm(o.s)+' – '+tm(o.e)}${o.ev.loc?' · '+esc(o.ev.loc):''}</small></span></button>`;
function dayList(d){const l=dayOcc(d),dt=[];return `<div class="lh">${d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}</div>`+(l.length||dt.length?l.map(row).join('')+dt.map(trow).join(''):empty('No events'))}
function vMonth(){const f1=new Date(cur.getFullYear(),cur.getMonth(),1),st=nd(f1,-((f1.getDay()-cfg.ws+7)%7));let g='';
 for(let i=0;i<42;i++){const d=nd(st,i),l=dayOcc(d);
  g+=`<button class="cl ${d.getMonth()!==cur.getMonth()?'out ':''}${+d===+sel?'sel ':''}${+d===+T?'tdy':''}" data-d="${+d}"><span class="dn">${d.getDate()}</span><span class="dots">${l.slice(0,3).map(o=>`<i style="background:${o.ev.color}"></i>`).join('')}</span><span class="cps">${l.slice(0,3).map(o=>`<span class="ev" ${ida(o)} style="${cs(o.ev.color)}">${ckb(o.ev)}${esc(o.ev.title)}</span>`).join('')}</span></button>`}
 return `<div class="vw mo"><div class="mw"><div class="mh">${('SMTWTFS'.slice(cfg.ws)+'SMTWTFS'.slice(0,cfg.ws)).split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="mg">${g}</div></div><div class="ml">${dayList(sel)}</div></div>`}
function grid(days){
 const head=`<div class="tgh"><div class="gut"></div>${days.map(d=>`<button class="dh ${+d===+T?'tdy':''}" data-day="${+d}"><span class="lb">${d.toLocaleDateString([],{weekday:'short'})}</span><span class="dn">${d.getDate()}</span></button>`).join('')}</div>`;
 const al=days.map(d=>dayOcc(d).filter(o=>o.ev.allDay));
